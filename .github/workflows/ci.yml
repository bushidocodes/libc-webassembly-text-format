name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install wabt (provides wat2wasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Assemble libc.wat
        run: wat2wasm libc.wat -o libc.wasm

      - name: Run tests
        run: node --test
